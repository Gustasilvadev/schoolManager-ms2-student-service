openapi: 3.0.0
info:
  title: API do SchoolManager - StudentService
  description: |
    Microsserviço de gestão de alunos.
    Todo aluno possui um ou mais responsáveis, que são gerenciados diretamente nos endpoints de aluno.
  version: 2.0.0
  contact:
    name: Suporte SchoolManager
    email: suporte@schoolmanager.com

servers:
  - url: http://localhost:3000/api
    description: Via API Gateway (recomendado — valida JWT, CORS, rate limit)
  - url: http://localhost:3002/api
    description: Direto no MS2 (somente desenvolvimento)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Responsible:
      type: object
      properties:
        responsible_id:
          type: integer
          example: 1
        responsible_name:
          type: string
          maxLength: 45
          example: "Maria da Silva"
        responsible_email:
          type: string
          format: email
          example: "maria@familia.com"
        responsible_status:
          type: integer
          description: "1=ativo, 0=inativo, 2=excluído"
          example: 1
      required:
        - responsible_name
        - responsible_email
        - responsible_status

    Student:
      type: object
      properties:
        student_id:
          type: integer
          example: 1
        student_name:
          type: string
          maxLength: 45
          example: "João Silva"
        student_birthday:
          type: string
          format: date
          example: "2010-05-20"
        student_cpf:
          type: string
          maxLength: 15
          example: "12345678900"
        student_email:
          type: string
          format: email
          example: "joao@escola.com"
        student_status:
          type: integer
          description: "1=ativo, 0=inativo, 2=excluído"
          example: 1
        student_photo:
          type: string
          format: uri
          nullable: true
          description: "URL pública da foto do aluno (hospedada no Cloudinary). Valor default (avatar padrão) definido no banco."
          example: "https://res.cloudinary.com/<cloud>/image/upload/v1/schoolmanager/students/1.jpg"
        responsibles:
          type: array
          description: Lista de responsáveis associados ao aluno
          items:
            $ref: '#/components/schemas/Responsible'
      required:
        - student_name
        - student_email
        - student_status

    StudentInput:
      type: object
      properties:
        student_name:
          type: string
          example: "João Silva"
        student_birthday:
          type: string
          format: date
          example: "2010-05-20"
        student_cpf:
          type: string
          example: "12345678900"
        student_email:
          type: string
          format: email
          example: "joao@escola.com"
        student_status:
          type: integer
          default: 1
        responsibles:
          type: array
          description: |
            Lista de responsáveis. Cada item deve conter
            `responsible_name` + `responsible_email`. Se um responsável com o
            mesmo `responsible_email` já existir, ele será reaproveitado;
            caso contrário, um novo responsável será criado.
          items:
            type: object
            properties:
              responsible_name:
                type: string
              responsible_email:
                type: string
              responsible_status:
                type: integer
                default: 1
            required:
              - responsible_name
              - responsible_email
      required:
        - student_name
        - student_birthday
        - student_cpf
        - student_email

    StudentListResponse:
      type: object
      properties:
        students:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /health:
    get:
      summary: Verifica saúde do serviço
      tags:
        - Health
      responses:
        '200':
          description: Serviço operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  service:
                    type: string
                    example: "student-service"

  # ==================== ALUNOS ====================
  /students/listStudents:
    get:
      summary: Lista alunos com paginação e filtros (apenas ADMIN)
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Número da página
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Itens por página
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1, 2]
          description: |
            Filtro fino por status. Quando informado, sobrepõe o default.
            Sem este parâmetro, ADMIN recebe apenas registros ACTIVE+INACTIVE (deletados ocultos).
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
          description: |
            Quando `true`, inclui alunos com status DELETED (2) na listagem. Padrão `false`.
            Ignorado quando `status` é informado explicitamente.
        - name: email
          in: query
          schema:
            type: string
          description: Filtro parcial por e-mail
        - name: name
          in: query
          schema:
            type: string
          description: Filtro parcial por nome
        - name: cpf
          in: query
          schema:
            type: string
          description: Filtro parcial por CPF
      responses:
        '200':
          description: Lista de alunos com seus responsáveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
        '401':
          description: Token inválido ou não fornecido
        '403':
          description: Acesso negado (requer papel ADMIN)

  /students/createStudent:
    post:
      summary: Cria um novo aluno com seus responsáveis (apenas ADMIN)
      tags:
        - Students
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '201':
          description: Aluno criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          description: E-mail ou CPF já cadastrado, ou dados inválidos
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado

  /students/listStudentById/{id}:
    get:
      summary: Busca aluno por ID (apenas ADMIN)
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID do aluno
      responses:
        '200':
          description: Dados do aluno com seus responsáveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          description: Aluno não encontrado
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado

  /students/updateStudentById/{id}:
    put:
      summary: Atualiza dados do aluno e sua lista de responsáveis (apenas ADMIN)
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '200':
          description: Aluno atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          description: |
            E-mail ou CPF já existe, dados inválidos, ou registro está deletado
            (status=2 — use `POST /students/restoreStudentById/{id}` para reativar).
        '404':
          description: Aluno não encontrado
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado

  /students/deleteStudentById/{id}:
    delete:
      summary: Exclusão lógica do aluno (apenas ADMIN)
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Aluno desativado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Aluno não encontrado
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado

  /students/restoreStudentById/{id}:
    post:
      summary: Restaura um aluno deletado (apenas ADMIN)
      description: |
        Promove o status do aluno de DELETED (2) para ACTIVE (1). Endpoint dedicado
        para reativação consciente — separa a intenção "editar dados" de
        "ressuscitar registro" e impede reativação acidental via update.
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Aluno restaurado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Aluno restaurado com sucesso"
                  student:
                    $ref: '#/components/schemas/Student'
        '400':
          description: Aluno não está deletado (nada a restaurar)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Acesso negado (requer papel ADMIN)
        '404':
          description: Aluno não encontrado

  /students/uploadPhotoById/{id}:
    post:
      summary: Faz upload da foto de um aluno (ADMIN ou TEACHER)
      description: |
        Recebe uma imagem via `multipart/form-data` (campo **`photo`**), envia ao
        Cloudinary direto da memória (sem disco) e persiste a URL pública em
        `student_photo`.

        Regras: limite **5 MB**; formatos **jpeg, jpg, png, webp**. O upload externo
        ocorre antes da escrita no banco — se o Cloudinary falhar, nada é gravado (503).
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID do aluno
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
                  description: "Arquivo de imagem (jpeg/jpg/png/webp, máx. 5 MB)"
      responses:
        '200':
          description: Foto atualizada; retorna o aluno com a nova `student_photo`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          description: Arquivo ausente, formato inválido, ou aluno inativo (status=2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado (requer ADMIN ou TEACHER)
        '404':
          description: Aluno não encontrado
        '413':
          description: Arquivo excede o limite de 5 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Falha ao enviar a imagem ao Cloudinary (serviço externo indisponível)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'